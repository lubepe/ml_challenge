[project]
name = "ml-challenge"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "bm25s>=0.3.16",
    "fastembed>=0.7.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "onnxruntime<1.24 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wands_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "mistune>=3.4.0",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
]
